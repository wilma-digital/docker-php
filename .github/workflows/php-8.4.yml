name: "8.4"
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/8.4/src/**'
      - '.github/workflows/php-8.4.yml'
      - 'Dockerfile.template'
      - 'versions.json'
  schedule:
    - cron: '30 8 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

# Prevent parallel workflow runs to avoid Docker Hub rate limits
concurrency:
  group: php-8.4-base
  cancel-in-progress: false

jobs:
  build-base:
    name: "PHP ${{ matrix.version }}.${{ matrix.patchVersion }} (${{ matrix.platform.arch }})"
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        version: ['8.4']
        patchVersion: [22, 23, 24, 25, 26]
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push php image by digest
        id: build-php
        uses: docker/build-push-action@v6
        with:
          platforms: linux/${{ matrix.platform.arch }}
          context: ./src/${{ matrix.version }}/src
          file: ./src/${{ matrix.version }}/src/Dockerfile
          target: php
          provenance: false
          build-args: |
            PHP_VERSION=${{ matrix.version }}.${{ matrix.patchVersion }}
          outputs: type=image,name=wilmadigital/php,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=wilmadigital/php-cache:${{ matrix.version }}-${{ matrix.patchVersion }}-php-${{ matrix.platform.arch }}
          cache-to: type=registry,ref=wilmadigital/php-cache:${{ matrix.version }}-${{ matrix.patchVersion }}-php-${{ matrix.platform.arch }},mode=max

      - name: Export php digest
        run: |
          mkdir -p /tmp/digests/php
          echo "${{ steps.build-php.outputs.digest }}" > "/tmp/digests/php/${{ matrix.platform.arch }}"

      - name: Build and push toolbox image by digest
        id: build-toolbox
        uses: docker/build-push-action@v6
        with:
          platforms: linux/${{ matrix.platform.arch }}
          context: ./src/${{ matrix.version }}/src
          file: ./src/${{ matrix.version }}/src/Dockerfile
          target: toolbox
          provenance: false
          build-args: |
            PHP_VERSION=${{ matrix.version }}.${{ matrix.patchVersion }}
          outputs: type=image,name=wilmadigital/php,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=wilmadigital/php-cache:${{ matrix.version }}-${{ matrix.patchVersion }}-toolbox-${{ matrix.platform.arch }}
          cache-to: type=registry,ref=wilmadigital/php-cache:${{ matrix.version }}-${{ matrix.patchVersion }}-toolbox-${{ matrix.platform.arch }},mode=max

      - name: Export toolbox digest
        run: |
          mkdir -p /tmp/digests/toolbox
          echo "${{ steps.build-toolbox.outputs.digest }}" > "/tmp/digests/toolbox/${{ matrix.platform.arch }}"

      - name: Upload digests
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.patchVersion }}-${{ matrix.platform.arch }}
          path: /tmp/digests/**
          retention-days: 1

  merge:
    name: "Merge PHP ${{ matrix.version }}.${{ matrix.patchVersion }}"
    needs: build-base
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ['8.4']
        patchVersion: [22, 23, 24, 25, 26]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.patchVersion }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Create php manifest
        run: |
          TAGS="-t wilmadigital/php:${{ matrix.version }}.${{ matrix.patchVersion }}"
          if [ "${{ matrix.patchVersion }}" = "26" ]; then
            TAGS="$TAGS -t wilmadigital/php:${{ matrix.version }}"
          fi
          docker buildx imagetools create $TAGS \
            wilmadigital/php@$(cat /tmp/digests/php/amd64) \
            wilmadigital/php@$(cat /tmp/digests/php/arm64)

      - name: Create toolbox manifest
        run: |
          TAGS="-t wilmadigital/php:${{ matrix.version }}.${{ matrix.patchVersion }}-toolbox"
          if [ "${{ matrix.patchVersion }}" = "26" ]; then
            TAGS="$TAGS -t wilmadigital/php:${{ matrix.version }}-toolbox"
          fi
          docker buildx imagetools create $TAGS \
            wilmadigital/php@$(cat /tmp/digests/toolbox/amd64) \
            wilmadigital/php@$(cat /tmp/digests/toolbox/arm64)

      - name: Smoke test php image
        run: |
          docker pull wilmadigital/php:${{ matrix.version }}.${{ matrix.patchVersion }}
          docker run --rm wilmadigital/php:${{ matrix.version }}.${{ matrix.patchVersion }} php -v
          docker run --rm wilmadigital/php:${{ matrix.version }}.${{ matrix.patchVersion }} php -m | grep -E "redis|imagick|opcache"
          docker run --rm wilmadigital/php:${{ matrix.version }}.${{ matrix.patchVersion }} composer --version

      - name: Trivy scan php-8.4.${{ matrix.patchVersion }}
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: wilmadigital/php:${{ matrix.version }}.${{ matrix.patchVersion }}
          format: 'sarif'
          output: 'trivy-php-8.4.${{ matrix.patchVersion }}.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results for php-8.4.${{ matrix.patchVersion }}
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-php-8.4.${{ matrix.patchVersion }}.sarif') != ''
        with:
          sarif_file: 'trivy-php-8.4.${{ matrix.patchVersion }}.sarif'
          category: 'trivy-php-8.4.${{ matrix.patchVersion }}'

      - name: Generate SBOM for php-8.4.${{ matrix.patchVersion }}
        uses: anchore/sbom-action@v0
        continue-on-error: true
        with:
          image: wilmadigital/php:${{ matrix.version }}.${{ matrix.patchVersion }}
          format: spdx-json
          output-file: 'sbom-php-8.4.${{ matrix.patchVersion }}.spdx.json'

      - name: Upload SBOM for php-8.4.${{ matrix.patchVersion }}
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('sbom-php-8.4.${{ matrix.patchVersion }}.spdx.json') != ''
        with:
          name: 'sbom-php-8.4.${{ matrix.patchVersion }}'
          path: 'sbom-php-8.4.${{ matrix.patchVersion }}.spdx.json'
          retention-days: 90

      - name: Trivy scan toolbox-8.4.${{ matrix.patchVersion }}
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: wilmadigital/php:${{ matrix.version }}.${{ matrix.patchVersion }}-toolbox
          format: 'sarif'
          output: 'trivy-toolbox-8.4.${{ matrix.patchVersion }}.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results for toolbox-8.4.${{ matrix.patchVersion }}
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-toolbox-8.4.${{ matrix.patchVersion }}.sarif') != ''
        with:
          sarif_file: 'trivy-toolbox-8.4.${{ matrix.patchVersion }}.sarif'
          category: 'trivy-toolbox-8.4.${{ matrix.patchVersion }}'

      - name: Generate SBOM for toolbox-8.4.${{ matrix.patchVersion }}
        uses: anchore/sbom-action@v0
        continue-on-error: true
        with:
          image: wilmadigital/php:${{ matrix.version }}.${{ matrix.patchVersion }}-toolbox
          format: spdx-json
          output-file: 'sbom-toolbox-8.4.${{ matrix.patchVersion }}.spdx.json'

      - name: Upload SBOM for toolbox-8.4.${{ matrix.patchVersion }}
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('sbom-toolbox-8.4.${{ matrix.patchVersion }}.spdx.json') != ''
        with:
          name: 'sbom-toolbox-8.4.${{ matrix.patchVersion }}'
          path: 'sbom-toolbox-8.4.${{ matrix.patchVersion }}.spdx.json'
          retention-days: 90
