name: "8.4"
on:
  workflow_dispatch:
    inputs:
      rebuild_all:
        description: 'Rebuild every patch in the window, not only new ones and the newest'
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - 'src/8.4/src/**'
      - '.github/workflows/php-8.4.yml'
      - 'Dockerfile.template'
      - 'versions.json'
  schedule:
    - cron: '30 8 * * 1'

permissions:
  contents: read
  packages: write
  security-events: write
  actions: read

# Prevent parallel workflow runs to avoid Docker Hub rate limits
concurrency:
  group: php-8.4-base
  cancel-in-progress: false

jobs:
  plan:
    name: "Select patches to build"
    runs-on: ubuntu-24.04
    outputs:
      patches: ${{ steps.select.outputs.patches }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Patches are built once and then frozen. Weekly runs refresh only the
      # newest patch; pushes add patches that are not on ghcr yet.
      - name: Select patches
        id: select
        env:
          EVENT: ${{ github.event_name }}
          REBUILD_ALL: ${{ inputs.rebuild_all }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            SELECTED="27"
          elif [ "$REBUILD_ALL" = "true" ]; then
            SELECTED="23 24 25 26 27"
          else
            SELECTED=""
            for p in 23 24 25 26 27; do
              if [ "$p" = "27" ] || ! docker buildx imagetools inspect "ghcr.io/wilma-digital/php:8.4.$p-fpm" >/dev/null 2>&1; then
                SELECTED="$SELECTED $p"
              fi
            done
          fi
          PATCHES="[$(echo "$SELECTED" | xargs | tr ' ' ',')]"
          echo "Building 8.4 patches: $PATCHES (window: [23, 24, 25, 26, 27])"
          echo "patches=$PATCHES" >> "$GITHUB_OUTPUT"

  build-base:
    name: "PHP ${{ matrix.version }}.${{ matrix.patchVersion }} (${{ matrix.platform.arch }})"
    needs: plan
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        version: ['8.4']
        patchVersion: ${{ fromJSON(needs.plan.outputs.patches) }}
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push php image by digest
        id: build-php
        uses: docker/build-push-action@v6
        with:
          platforms: linux/${{ matrix.platform.arch }}
          context: ./src/${{ matrix.version }}/src
          file: ./src/${{ matrix.version }}/src/Dockerfile
          target: php
          provenance: false
          build-args: |
            PHP_VERSION=${{ matrix.version }}.${{ matrix.patchVersion }}
          outputs: type=image,name=ghcr.io/wilma-digital/php,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=ghcr.io/wilma-digital/php-cache:${{ matrix.version }}-${{ matrix.patchVersion }}-php-${{ matrix.platform.arch }}
          cache-to: type=registry,ref=ghcr.io/wilma-digital/php-cache:${{ matrix.version }}-${{ matrix.patchVersion }}-php-${{ matrix.platform.arch }},mode=max

      - name: Export php digest
        run: |
          mkdir -p /tmp/digests/php
          echo "${{ steps.build-php.outputs.digest }}" > "/tmp/digests/php/${{ matrix.platform.arch }}"

      - name: Build and push toolbox image by digest
        id: build-toolbox
        uses: docker/build-push-action@v6
        with:
          platforms: linux/${{ matrix.platform.arch }}
          context: ./src/${{ matrix.version }}/src
          file: ./src/${{ matrix.version }}/src/Dockerfile
          target: toolbox
          provenance: false
          build-args: |
            PHP_VERSION=${{ matrix.version }}.${{ matrix.patchVersion }}
          outputs: type=image,name=ghcr.io/wilma-digital/php,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=ghcr.io/wilma-digital/php-cache:${{ matrix.version }}-${{ matrix.patchVersion }}-toolbox-${{ matrix.platform.arch }}
          cache-to: type=registry,ref=ghcr.io/wilma-digital/php-cache:${{ matrix.version }}-${{ matrix.patchVersion }}-toolbox-${{ matrix.platform.arch }},mode=max

      - name: Export toolbox digest
        run: |
          mkdir -p /tmp/digests/toolbox
          echo "${{ steps.build-toolbox.outputs.digest }}" > "/tmp/digests/toolbox/${{ matrix.platform.arch }}"

      - name: Upload digests
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.patchVersion }}-${{ matrix.platform.arch }}
          path: /tmp/digests/**
          retention-days: 1

  merge:
    name: "Merge PHP ${{ matrix.version }}.${{ matrix.patchVersion }}"
    needs: [plan, build-base]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ['8.4']
        patchVersion: ${{ fromJSON(needs.plan.outputs.patches) }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.patchVersion }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Create fpm manifest
        env:
          V: ${{ matrix.version }}
          P: ${{ matrix.patchVersion }}
        run: |
          NAMES="$V.$P $V.$P-fpm"
          if [ "$P" = "27" ]; then
            NAMES="$NAMES $V $V-fpm"
          fi
          TAGS=()
          for n in $NAMES; do
            TAGS+=(-t "ghcr.io/wilma-digital/php:$n" -t "docker.io/wilmadigital/php:$n")
          done
          docker buildx imagetools create "${TAGS[@]}" \
            "ghcr.io/wilma-digital/php@$(cat /tmp/digests/php/amd64)" \
            "ghcr.io/wilma-digital/php@$(cat /tmp/digests/php/arm64)"

      - name: Create toolbox manifest
        env:
          V: ${{ matrix.version }}
          P: ${{ matrix.patchVersion }}
        run: |
          NAMES="$V.$P-toolbox"
          if [ "$P" = "27" ]; then
            NAMES="$NAMES $V-toolbox"
          fi
          TAGS=()
          for n in $NAMES; do
            TAGS+=(-t "ghcr.io/wilma-digital/php:$n" -t "docker.io/wilmadigital/php:$n")
          done
          docker buildx imagetools create "${TAGS[@]}" \
            "ghcr.io/wilma-digital/php@$(cat /tmp/digests/toolbox/amd64)" \
            "ghcr.io/wilma-digital/php@$(cat /tmp/digests/toolbox/arm64)"

      - name: Smoke test images
        shell: bash
        run: |
          set -euo pipefail
          docker pull ghcr.io/wilma-digital/php:${{ matrix.version }}.${{ matrix.patchVersion }}-fpm
          docker pull ghcr.io/wilma-digital/php:${{ matrix.version }}.${{ matrix.patchVersion }}-toolbox
          docker run --rm ghcr.io/wilma-digital/php:${{ matrix.version }}.${{ matrix.patchVersion }}-fpm php -v
          docker run --rm ghcr.io/wilma-digital/php:${{ matrix.version }}.${{ matrix.patchVersion }}-fpm composer --version
          docker run --rm ghcr.io/wilma-digital/php:${{ matrix.version }}.${{ matrix.patchVersion }}-fpm which patch
          docker run --rm ghcr.io/wilma-digital/php:${{ matrix.version }}.${{ matrix.patchVersion }}-fpm php -m | grep -E "redis|imagick|opcache"

      - name: Trivy scan php
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ghcr.io/wilma-digital/php:${{ matrix.version }}.${{ matrix.patchVersion }}-fpm
          format: 'sarif'
          output: 'trivy-php.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results for php
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-php.sarif') != ''
        with:
          sarif_file: 'trivy-php.sarif'
          category: 'trivy-php-8.4.${{ matrix.patchVersion }}'

      - name: Generate SBOM for php
        uses: anchore/sbom-action@v0
        continue-on-error: true
        with:
          image: ghcr.io/wilma-digital/php:${{ matrix.version }}.${{ matrix.patchVersion }}-fpm
          format: spdx-json
          output-file: 'sbom-php.spdx.json'

      - name: Upload SBOM for php
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('sbom-php.spdx.json') != ''
        with:
          name: 'sbom-php-8.4.${{ matrix.patchVersion }}'
          path: 'sbom-php.spdx.json'
          retention-days: 90

      - name: Trivy scan toolbox
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ghcr.io/wilma-digital/php:${{ matrix.version }}.${{ matrix.patchVersion }}-toolbox
          format: 'sarif'
          output: 'trivy-toolbox.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results for toolbox
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-toolbox.sarif') != ''
        with:
          sarif_file: 'trivy-toolbox.sarif'
          category: 'trivy-toolbox-8.4.${{ matrix.patchVersion }}'

      - name: Generate SBOM for toolbox
        uses: anchore/sbom-action@v0
        continue-on-error: true
        with:
          image: ghcr.io/wilma-digital/php:${{ matrix.version }}.${{ matrix.patchVersion }}-toolbox
          format: spdx-json
          output-file: 'sbom-toolbox.spdx.json'

      - name: Upload SBOM for toolbox
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('sbom-toolbox.spdx.json') != ''
        with:
          name: 'sbom-toolbox-8.4.${{ matrix.patchVersion }}'
          path: 'sbom-toolbox.spdx.json'
          retention-days: 90
