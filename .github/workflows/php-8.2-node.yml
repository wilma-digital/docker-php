name: "8.2-node"
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/8.2/node*/**'
      - '.github/workflows/php-8.2-node.yml'
      - 'Dockerfile.node.template'
      - 'versions.json'
  schedule:
    # Runs the day after the base php-8.2 images are built.
    - cron: '30 7 * * 2'

permissions:
  contents: read
  packages: write
  security-events: write
  actions: read

# Prevent parallel workflow runs to avoid Docker Hub rate limits
concurrency:
  group: php-8.2-node
  cancel-in-progress: false

jobs:
  build-node:
    name: "PHP 8.2.34 toolbox + Node ${{ matrix.nodeVersion }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nodeVersion: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push toolbox+node image
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/wilma-digital/php:8.2.34-toolbox-node${{ matrix.nodeVersion }}
            ghcr.io/wilma-digital/php:8.2-toolbox-node${{ matrix.nodeVersion }}
            ghcr.io/wilma-digital/php:8.2-node${{ matrix.nodeVersion }}-toolbox
            docker.io/wilmadigital/php:8.2.34-toolbox-node${{ matrix.nodeVersion }}
            docker.io/wilmadigital/php:8.2-toolbox-node${{ matrix.nodeVersion }}
            docker.io/wilmadigital/php:8.2-node${{ matrix.nodeVersion }}-toolbox
          context: ./src/8.2/node${{ matrix.nodeVersion }}/src
          file: ./src/8.2/node${{ matrix.nodeVersion }}/src/Dockerfile
          target: toolbox
          build-args: |
            BASE_IMAGE=ghcr.io/wilma-digital/php
            PHP_VERSION=8.2.34
            NODE_VERSION=${{ matrix.nodeVersion }}
          cache-from: type=registry,ref=ghcr.io/wilma-digital/php-cache:8.2-node${{ matrix.nodeVersion }}-toolbox
          cache-to: type=registry,ref=ghcr.io/wilma-digital/php-cache:8.2-node${{ matrix.nodeVersion }}-toolbox,mode=max

      - name: Smoke test toolbox+node image
        run: |
          docker pull ghcr.io/wilma-digital/php:8.2.34-toolbox-node${{ matrix.nodeVersion }}
          docker run --rm ghcr.io/wilma-digital/php:8.2.34-toolbox-node${{ matrix.nodeVersion }} php -v
          docker run --rm ghcr.io/wilma-digital/php:8.2.34-toolbox-node${{ matrix.nodeVersion }} node -v
          docker run --rm ghcr.io/wilma-digital/php:8.2.34-toolbox-node${{ matrix.nodeVersion }} npm -v

      - name: Trivy scan toolbox-node
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ghcr.io/wilma-digital/php:8.2.34-toolbox-node${{ matrix.nodeVersion }}
          format: 'sarif'
          output: 'trivy-toolbox-node.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results for toolbox-node
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-toolbox-node.sarif') != ''
        with:
          sarif_file: 'trivy-toolbox-node.sarif'
          category: 'trivy-toolbox-8.2.34-node${{ matrix.nodeVersion }}'

      - name: Generate SBOM for toolbox-node
        uses: anchore/sbom-action@v0
        continue-on-error: true
        with:
          image: ghcr.io/wilma-digital/php:8.2.34-toolbox-node${{ matrix.nodeVersion }}
          format: spdx-json
          output-file: 'sbom-toolbox-node.spdx.json'

      - name: Upload SBOM for toolbox-node
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('sbom-toolbox-node.spdx.json') != ''
        with:
          name: 'sbom-toolbox-8.2.34-node${{ matrix.nodeVersion }}'
          path: 'sbom-toolbox-node.spdx.json'
          retention-days: 90
