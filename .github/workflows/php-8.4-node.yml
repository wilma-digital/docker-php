name: "8.4-node"
on:
  workflow_dispatch:
  # Chained after the base workflow: the variants build FROM its toolbox image.
  # Covers the weekly refresh and every base change (templates, versions.json).
  workflow_run:
    workflows: ["8.4"]
    types: [completed]
    branches: [main]
  push:
    branches:
      - main
    paths:
      - 'src/8.4/node*/**'
      - '.github/workflows/php-8.4-node.yml'

permissions:
  contents: read
  packages: write
  security-events: write
  actions: read

# Prevent parallel workflow runs to avoid Docker Hub rate limits
concurrency:
  group: php-8.4-node
  cancel-in-progress: false

jobs:
  plan:
    name: "Check base toolbox image"
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A push can change the base and the node files at once (e.g. a patch bump).
      # Then the base image may not be on ghcr yet; the run chained after
      # php-8.4 builds the variants instead of failing here.
      - name: Check ghcr.io/wilma-digital/php:8.4.27-toolbox
        id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if docker buildx imagetools inspect "ghcr.io/wilma-digital/php:8.4.27-toolbox" >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "push" ]; then
            echo "::notice::8.4.27-toolbox is not on ghcr yet, the run after workflow 8.4 builds the Node variants."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::ghcr.io/wilma-digital/php:8.4.27-toolbox not found, run workflow 8.4 first."
            exit 1
          fi

  build-node:
    name: "PHP 8.4.27 toolbox + Node ${{ matrix.nodeVersion }}"
    needs: plan
    if: needs.plan.outputs.ready == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nodeVersion: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run: build the commit the base images were built from
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push toolbox+node image
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/wilma-digital/php:8.4.27-toolbox-node${{ matrix.nodeVersion }}
            ghcr.io/wilma-digital/php:8.4-toolbox-node${{ matrix.nodeVersion }}
            ghcr.io/wilma-digital/php:8.4-node${{ matrix.nodeVersion }}-toolbox
            docker.io/wilmadigital/php:8.4.27-toolbox-node${{ matrix.nodeVersion }}
            docker.io/wilmadigital/php:8.4-toolbox-node${{ matrix.nodeVersion }}
            docker.io/wilmadigital/php:8.4-node${{ matrix.nodeVersion }}-toolbox
          context: ./src/8.4/node${{ matrix.nodeVersion }}/src
          file: ./src/8.4/node${{ matrix.nodeVersion }}/src/Dockerfile
          target: toolbox
          build-args: |
            BASE_IMAGE=ghcr.io/wilma-digital/php
            PHP_VERSION=8.4.27
            NODE_VERSION=${{ matrix.nodeVersion }}
          cache-from: type=registry,ref=ghcr.io/wilma-digital/php-cache:8.4-node${{ matrix.nodeVersion }}-toolbox
          cache-to: type=registry,ref=ghcr.io/wilma-digital/php-cache:8.4-node${{ matrix.nodeVersion }}-toolbox,mode=max

      - name: Smoke test toolbox+node image
        run: |
          docker pull ghcr.io/wilma-digital/php:8.4.27-toolbox-node${{ matrix.nodeVersion }}
          docker run --rm ghcr.io/wilma-digital/php:8.4.27-toolbox-node${{ matrix.nodeVersion }} php -v
          docker run --rm ghcr.io/wilma-digital/php:8.4.27-toolbox-node${{ matrix.nodeVersion }} node -v
          docker run --rm ghcr.io/wilma-digital/php:8.4.27-toolbox-node${{ matrix.nodeVersion }} npm -v

      - name: Trivy scan toolbox-node
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ghcr.io/wilma-digital/php:8.4.27-toolbox-node${{ matrix.nodeVersion }}
          format: 'sarif'
          output: 'trivy-toolbox-node.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results for toolbox-node
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-toolbox-node.sarif') != ''
        with:
          sarif_file: 'trivy-toolbox-node.sarif'
          category: 'trivy-toolbox-8.4.27-node${{ matrix.nodeVersion }}'

      - name: Generate SBOM for toolbox-node
        uses: anchore/sbom-action@v0
        continue-on-error: true
        with:
          image: ghcr.io/wilma-digital/php:8.4.27-toolbox-node${{ matrix.nodeVersion }}
          format: spdx-json
          output-file: 'sbom-toolbox-node.spdx.json'

      - name: Upload SBOM for toolbox-node
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('sbom-toolbox-node.spdx.json') != ''
        with:
          name: 'sbom-toolbox-8.4.27-node${{ matrix.nodeVersion }}'
          path: 'sbom-toolbox-node.spdx.json'
          retention-days: 90
