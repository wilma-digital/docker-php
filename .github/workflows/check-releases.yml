name: "Check PHP Releases"

on:
  schedule:
    # Run every Monday at 8:00 AM UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  check-releases:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check for PHP release updates
        id: check
        run: |
          chmod +x check-php-releases.py
          if python3 check-php-releases.py; then
            echo "updated=false" >> $GITHUB_OUTPUT
          else
            echo "updated=true" >> $GITHUB_OUTPUT
          fi

      - name: Regenerate Dockerfiles
        if: steps.check.outputs.updated == 'true'
        run: |
          chmod +x generate-dockerfiles.py
          python3 generate-dockerfiles.py

      - name: Regenerate workflows
        if: steps.check.outputs.updated == 'true'
        run: |
          chmod +x generate-workflows.py
          python3 generate-workflows.py

      - name: Create Pull Request
        if: steps.check.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: '[AUTO] Update PHP versions'
          committer: GitHub Actions <actions@github.com>
          author: GitHub Actions <actions@github.com>
          branch: auto-update-php-versions
          delete-branch: true
          title: '[AUTO] Update PHP versions'
          body: |
            ## Automated PHP Version Update

            This PR was automatically generated by the PHP release checker workflow.

            ### Changes
            - Updated `versions.json` with latest PHP patch versions
            - Regenerated Dockerfiles from template
            - Regenerated GitHub Actions workflows

            ### Next Steps
            1. Review the changes in `versions.json`
            2. Check that Dockerfiles were regenerated correctly
            3. Verify workflow changes
            4. Merge this PR to trigger builds for new versions

            ### Testing
            Before merging, you may want to test build one of the updated versions locally:
            ```bash
            docker build -f src/8.X/src/Dockerfile -t test:latest src/8.X/src/
            ```

            ---
            *This PR was created by the [check-releases](.github/workflows/check-releases.yml) workflow.*
          labels: |
            automated
            dependencies
            php-update

      - name: Check PR creation
        if: steps.check.outputs.updated == 'true'
        run: |
          echo "✓ Pull request created successfully"
          echo "→ Review the PR and merge to trigger builds"
